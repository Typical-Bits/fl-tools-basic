name: Syntax check
on:
  push:
    paths:
      - "**/*.user.js"
  pull_request:
    paths:
      - "**/*.user.js"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: node --check userscripts
        run: |
          set -e
          for f in $(git ls-files '*.user.js'); do
            echo "check $f"
            node --check "$f"
          done
