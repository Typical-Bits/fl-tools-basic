name: Syntax check
on:
  push:
    paths:
      - "**/*.user.js"
      - "core/**"
      - "scripts/**"
      - "assets/*.css"
  pull_request:
    paths:
      - "**/*.user.js"
      - "core/**"
      - "scripts/**"
      - "assets/*.css"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: node --check userscripts and core
        run: |
          set -e
          for f in $(git ls-files '*.user.js' 'core/*.js' 'scripts/*.mjs'); do
            echo "check $f"
            node --check "$f"
          done
