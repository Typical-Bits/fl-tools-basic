name: Publish release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate version and README
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          grep -q "^// @version[[:space:]]*$ver$" FL_Tools_Basic.user.js
          grep -q "FL_Tools Basic v$ver" FL_Tools_Basic.user.js
          grep -q "releases/tag/$RELEASE_TAG" README.md
          test -f assets/fl-tools-basic-icon.svg
          test -f assets/fl-tools-core.css
          test -f assets/fl-tools-pro.css
          test -f core/handoff.js
          test -f core/css-core.js
          test -f core/css-pro.js
          node scripts/sync-core.mjs --check
      - name: Validate generated userscript syntax
        run: |
          set -euo pipefail
          node --check FL_Tools_Basic.user.js
          tag_ver="${GITHUB_REF_NAME#v}"
          file_ver="$(sed -n 's#^// @version[[:space:]]*##p' FL_Tools_Basic.user.js | head -n1)"
          test "$file_ver" = "$tag_ver"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            FL_Tools_Basic.user.js \
            core/handoff.js \
            core/css-core.js \
            core/css-pro.js \
            assets/fl-tools-core.css \
            assets/fl-tools-pro.css \
            assets/fl-tools-basic-icon.svg \
            assets/fl-tools-basic-icon-64.png \
            assets/fl-tools-basic-icon-128.png \
            --clobber
