name: Create release after version bump

on:
  workflow_run:
    workflows: ["Bump release version"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read version
        id: version
        run: echo "version=$(sed -n 's#^// @version[[:space:]]*##p' FL_Tools_Basic.user.js | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Validate generated asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          node --check FL_Tools_Basic.user.js
          grep -q "^// @version[[:space:]]*$VERSION$" FL_Tools_Basic.user.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" FL_Tools_Basic.user.js --title "FL_Tools Basic v$VERSION" --generate-notes
