name: Create release after version bump

on:
  push:
    branches: [main]
    paths:
      - FL_Tools_Basic.user.js
      - .github/workflows/release-after-bump.yml
  workflow_run:
    workflows: ["Bump release version"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Read version
        id: version
        run: echo "version=$(sed -n 's#^// @version[[:space:]]*##p' FL_Tools_Basic.user.js | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Validate generated asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          node --check FL_Tools_Basic.user.js
          grep -q "^// @version[[:space:]]*$VERSION$" FL_Tools_Basic.user.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: "Shared dock CSS and edition handoff are the source of truth (assets/ + core/), inlined into the standalone userscript. Basic yields only while Pro's heartbeat is fresh (<4s) and Pro UI is present. This release also attaches handoff.js, css-core.js, css-pro.js, fl-tools-core.css, and fl-tools-pro.css for Pro to vendor or @require a tagged URL (never latest). DOM scan, yield, migration, syntax, and UI-contract checks passed."
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "FL_Tools Basic v$VERSION" --notes "$NOTES"
          else
              gh release create "$tag" FL_Tools_Basic.user.js --title "FL_Tools Basic v$VERSION" --notes "$NOTES"
          fi
          # GITHUB_TOKEN-created releases do not retrigger "on: release" workflows,
          # so attach tagged shared files here (basenames: handoff.js, css-core.js, …).
          node scripts/sync-core.mjs --check
          gh release upload "$tag" \
            FL_Tools_Basic.user.js \
            core/handoff.js \
            core/css-core.js \
            core/css-pro.js \
            assets/fl-tools-core.css \
            assets/fl-tools-pro.css \
            --clobber
