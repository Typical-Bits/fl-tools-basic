name: Update release notes
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing RELEASE_NOTES.md
        required: true
        type: string
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Update release notes from the tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -s RELEASE_NOTES.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
