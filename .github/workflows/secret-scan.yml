name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d)
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$tool_dir"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan complete reachable history
        run: gitleaks git . --log-opts=--all --redact=100 --no-banner
